name: iOS IPA Build

on:
  push:
    branches: [Aok]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: cd kaliOS && npm ci

      - name: Install Expo CLI
        run: npm install -g expo

      - name: Expo prebuild iOS
        run: cd kaliOS && npx expo prebuild --platform ios --clean --no-install

      # Inject SWIFT_VERSION=5 inside the single existing post_install block.
      # printf '%s\n' prints the argument as-is (no \n -> newline conversion in %s args).
      - name: Patch Podfile - inject Swift 5 inside existing post_install
        run: |
          PODFILE="$GITHUB_WORKSPACE/kaliOS/ios/Podfile"
          PY="$RUNNER_TEMP/patch_podfile.py"
          printf '%s\n' 'import sys'                                                         >  "$PY"
          printf '%s\n' 'path = sys.argv[1]'                                                >> "$PY"
          printf '%s\n' 'txt = open(path).read()'                                           >> "$PY"
          printf '%s\n' 'ins  = "\n  # CI: force Swift 5 (suppress Swift 6 errors)\n"'    >> "$PY"
          printf '%s\n' 'ins += "  installer.pods_project.targets.each do |target|\n"'     >> "$PY"
          printf '%s\n' 'ins += "    target.build_configurations.each do |config|\n"'      >> "$PY"
          printf '%s\n' "ins += \"      config.build_settings['SWIFT_VERSION'] = '5'\\n\"" >> "$PY"
          printf '%s\n' 'ins += "    end\n  end\n"'                                          >> "$PY"
          printf '%s\n' 'needle = "post_install do |installer|"'                            >> "$PY"
          printf '%s\n' 'txt = txt.replace(needle, needle + ins, 1)'                        >> "$PY"
          printf '%s\n' 'open(path, "w").write(txt)'                                        >> "$PY"
          echo '--- Python script ---'
          cat "$PY"
          echo '--- Running patch ---'
          python3 "$PY" "$PODFILE"
          echo '--- Podfile tail ---'
          tail -20 "$PODFILE"

      - name: Pod install
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kaliOS/ios"
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/pod-install.log"

      - name: Build .app unsigned
        run: |
          set -o pipefail
          IOS_DIR="$GITHUB_WORKSPACE/kaliOS/ios"
          BUILD_DIR="$RUNNER_TEMP/build"
          LOG_FILE="$RUNNER_TEMP/xcodebuild.log"
          mkdir -p "$BUILD_DIR"

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcworkspace" \
            -not -name "Pods.xcworkspace" \
            -not -path "*/xcuserdata/*" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERREUR: aucun .xcworkspace"
            ls -la "$IOS_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} /^[[:space:]]*$/{flag=0} flag{gsub(/^[[:space:]]+/,""); print; exit}')
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Workspace : $WORKSPACE"
          echo "Scheme    : $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "===== ERREURS SWIFT ====="
            grep -E '^.+error: ' "$LOG_FILE" | head -60
            echo "===== RAW TAIL ====="
            tail -60 "$LOG_FILE"
            exit 1
          fi

          echo "===== Apps trouvees ====="
          find "$BUILD_DIR" -name "*.app" -not -name "*.appex"

      - name: Package .ipa
        run: |
          BUILD_DIR="$RUNNER_TEMP/build"
          APP_PATH=$(find "$BUILD_DIR/Build/Products" -maxdepth 3 \
            -path "*Release-iphoneos*" -name "*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          echo "APP: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            find "$BUILD_DIR" -maxdepth 6
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "IPA OK!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
