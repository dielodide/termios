name: iOS IPA Build

on:
  push:
    branches:
      - Aok
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: |
          cd kaliOS
          npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Expo Prebuild iOS
        run: |
          cd kaliOS
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install --repo-update

      - name: Get scheme name
        id: scheme
        run: |
          SCHEME=$(cd kaliOS/ios && ls *.xcworkspace | sed 's/.xcworkspace//')
          echo "name=$SCHEME" >> $GITHUB_OUTPUT
          echo "Scheme: $SCHEME"
          echo "=== Schemes disponibles ==="
          cd kaliOS/ios && xcodebuild -list 2>&1 || true

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          BUILD_DIR=$RUNNER_TEMP/build
          mkdir -p $BUILD_DIR
          LOG_FILE=$RUNNER_TEMP/xcodebuild.log
          cd kaliOS/ios

          xcodebuild build \
            -workspace "${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $BUILD_DIR \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee $LOG_FILE

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — Dernières erreurs ==="
            grep -E "error:|warning:|note:" $LOG_FILE | tail -30
            exit 1
          fi

          echo "=== Contenu DerivedData ==="
          find $BUILD_DIR/Build/Products -maxdepth 3 2>/dev/null || echo "Vide"

      - name: Find and package .ipa
        run: |
          BUILD_DIR=$RUNNER_TEMP/build

          echo "=== Tous les .app trouvés ==="
          find $BUILD_DIR -name "*.app" 2>/dev/null

          APP_PATH=$(find $BUILD_DIR/Build/Products -name "*.app" \
            -not -path "*simulator*" \
            -not -path "*SimulatorSDK*" \
            -not -name "*.appex" \
            2>/dev/null | head -1)

          echo "APP_PATH retenu: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERREUR: Aucun .app device trouvé"
            exit 1
          fi

          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "✅ IPA créé avec succès"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30
