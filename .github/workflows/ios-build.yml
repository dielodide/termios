name: iOS IPA Build

on:
  push:
    branches: [Aok]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: cd kaliOS && npm ci

      # ── Layer 1: patch EMC Swift source before prebuild ─────────────
      # Fixes syntax that is invalid in Swift-5 mode:
      #   "extension UIView: @MainActor AnyArgument"
      #   → "@MainActor extension UIView: AnyArgument"
      # and adds @Sendable to PersistentFileLog completion handler.
      # ────────────────────────────────────────────────────────────────
      - name: Patch ExpoModulesCore Swift source
        run: |
          EMC="$GITHUB_WORKSPACE/kaliOS/node_modules/expo-modules-core/ios"

          patch_file() {
            local f="$1" from="$2" to="$3"
            [ -f "$f" ] || return 0
            grep -qF "$from" "$f" && sed -i '' "s|${from}|${to}|g" "$f" \
              && echo "Patched: $f" || echo "Pattern not found (skip): $f"
          }

          patch_file "$EMC/Core/ViewDefinition.swift" \
            "extension UIView: @MainActor AnyArgument" \
            "@MainActor extension UIView: AnyArgument"
          patch_file "$EMC/Core/Views/ViewDefinition.swift" \
            "extension UIView: @MainActor AnyArgument" \
            "@MainActor extension UIView: AnyArgument"
          patch_file "$EMC/Core/Logging/PersistentFileLog.swift" \
            "typealias PersistentFileLogCompletionHandler = (Error?) -> Void" \
            "typealias PersistentFileLogCompletionHandler = @Sendable (Error?) -> Void"

          # Broad fallback: any remaining `: @MainActor Protocol` on class/extension lines
          find "$EMC" -name "*.swift" | while IFS= read -r f; do
            grep -qF ': @MainActor ' "$f" 2>/dev/null || continue
            perl -i -pe 's/^((?:class|extension|struct|enum)\s.*?): @MainActor (\S)/$1: $2/g' "$f" 2>/dev/null || true
            echo "Broad-patch: $f"
          done
          echo "=== Source patch done ==="

      - name: Expo prebuild iOS
        run: cd kaliOS && npx expo prebuild --platform ios --clean --no-install

      # ── Layer 2: inject into the EXISTING post_install block ─────────
      # CocoaPods rejects multiple post_install hooks.
      # Expo prebuild generates exactly one post_install block.
      # We use Python to insert our SWIFT_VERSION=5 code right after
      # the opening line of that block.
      # ─────────────────────────────────────────────────────────────────
      - name: Patch Podfile – inject SWIFT_VERSION=5 for ExpoModulesCore
        run: |
          python3 - <<'PYEOF'
          import sys, re

          path = "$GITHUB_WORKSPACE/kaliOS/ios/Podfile"

          injection = """
            # ── ExpoModulesCore Swift-6 concurrency fix (expo/expo#42525) ──
            expo_swift5_targets = %w[ExpoModulesCore ExpoModulesJSI]
            installer.pods_project.targets.each do |t|
              next unless expo_swift5_targets.include?(t.name)
              t.build_configurations.each do |c|
                c.build_settings['SWIFT_VERSION'] = '5'
                base = c.build_settings['OTHER_SWIFT_FLAGS'] || '$(inherited)'
                c.build_settings['OTHER_SWIFT_FLAGS'] = "#{base} -strict-concurrency=minimal"
              end
            end
            # ──────────────────────────────────────────────────────────────
          """

          with open(path, 'r') as f:
              content = f.read()

          marker = 'post_install do |installer|'
          if marker not in content:
              print(f"ERROR: '{marker}' not found in Podfile", file=sys.stderr)
              sys.exit(1)

          # Replace only the FIRST occurrence
          patched = content.replace(marker, marker + '\n' + injection, 1)

          with open(path, 'w') as f:
              f.write(patched)

          print('Podfile patched successfully.')
          # Show tail for verification
          lines = patched.splitlines()
          hook_idx = next(i for i,l in enumerate(lines) if marker in l)
          print('\n'.join(lines[hook_idx:hook_idx+20]))
          PYEOF

      - name: Pod install
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kaliOS/ios"
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/pod-install.log"

      - name: Build .app unsigned
        run: |
          set -o pipefail
          IOS_DIR="$GITHUB_WORKSPACE/kaliOS/ios"
          BUILD_DIR="$RUNNER_TEMP/build"
          LOG_FILE="$RUNNER_TEMP/xcodebuild.log"
          mkdir -p "$BUILD_DIR"

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcworkspace" \
            -not -name "Pods.xcworkspace" -not -path "*/xcuserdata/*" | head -1)
          [ -z "$WORKSPACE" ] && { echo "ERR: no .xcworkspace"; ls -la "$IOS_DIR"; exit 1; }

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/{f=1;next} /^[[:space:]]*$/{f=0} f{gsub(/^[[:space:]]+/,""); print; exit}')
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  |  Scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "===== ERRORS =====" && grep -E '^.+error: ' "$LOG_FILE" | head -80
            echo "===== TAIL =====" && tail -80 "$LOG_FILE"
            exit 1
          fi
          find "$BUILD_DIR" -name "*.app" -not -name "*.appex"

      - name: Package .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build/Build/Products" -maxdepth 3 \
            -path "*Release-iphoneos*" -name "*.app" -not -name "*.appex" 2>/dev/null | head -1)
          [ -z "$APP_PATH" ] && { find "$RUNNER_TEMP/build" -maxdepth 6; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa && echo "IPA OK!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
