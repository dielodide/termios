name: iOS IPA Build

on:
  push:
    branches: [Aok]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: cd kaliOS && npm ci

      - name: Install Expo CLI
        run: npm install -g expo

      - name: Expo prebuild iOS
        run: cd kaliOS && npx expo prebuild --platform ios --clean --no-install

      - name: Upload Podfile (debug)
        uses: actions/upload-artifact@v4
        with:
          name: podfile-raw
          path: ${{ github.workspace }}/kaliOS/ios/Podfile
          retention-days: 7

      - name: Patch Podfile - inject codesign disable into existing post_install
        run: |
          python3 << 'PYEOF'
          import os, re
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "kaliOS", "ios", "Podfile")
          s = open(path).read()
          marker = "SUKIT_DISABLE_PODS_CODESIGN"
          if marker in s:
              print("already patched")
              raise SystemExit(0)
          inject = """
            # SUKIT_DISABLE_PODS_CODESIGN
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['PROVISIONING_PROFILE'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          """
          m = re.search(r"^post_install do \|installer\|\s*\n", s, flags=re.M)
          if m:
              s = s[:m.end()] + inject + s[m.end():]
              print("Injected into existing post_install")
          else:
              s += "\npost_install do |installer|\n" + inject + "\nend\n"
              print("Created new post_install")
          open(path, "w").write(s)
          print("Done")
          PYEOF

      - name: Pod install
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kaliOS/ios"
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/pod-install.log"

      - name: Build .app unsigned
        run: |
          set -o pipefail
          IOS_DIR="$GITHUB_WORKSPACE/kaliOS/ios"
          BUILD_DIR="$RUNNER_TEMP/build"
          LOG_FILE="$RUNNER_TEMP/xcodebuild.log"
          mkdir -p "$BUILD_DIR"

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcworkspace" \
            -not -name "Pods.xcworkspace" \
            -not -path "*/xcuserdata/*" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERREUR: aucun .xcworkspace dans $IOS_DIR"
            ls -la "$IOS_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} /^[[:space:]]*$/{flag=0} flag{gsub(/^[[:space:]]+/,""); print; exit}')
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Workspace : $WORKSPACE"
          echo "Scheme    : $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "===== ERRORS ====="
            grep "error:" "$LOG_FILE" | grep -v "^note" | tail -50
            exit 1
          fi

          echo "===== Apps generees ====="
          find "$BUILD_DIR" -name "*.app" -not -name "*.appex"

      - name: Package .ipa
        run: |
          BUILD_DIR="$RUNNER_TEMP/build"
          APP_PATH=$(find "$BUILD_DIR/Build/Products" -maxdepth 3 \
            -path "*Release-iphoneos*" -name "*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          echo "APP: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            find "$BUILD_DIR" -maxdepth 6
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "IPA OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
