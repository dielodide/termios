name: iOS IPA Build

on:
  push:
    branches:
      - Aok
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: |
          cd kaliOS
          npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Expo Prebuild iOS
        run: |
          cd kaliOS
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install --repo-update

      - name: Inspect ios/ directory
        run: |
          echo "=== Contenu de kaliOS/ios/ ==="
          ls -la $GITHUB_WORKSPACE/kaliOS/ios/
          echo "=== Workspaces ==="
          find $GITHUB_WORKSPACE/kaliOS/ios -name "*.xcworkspace" -maxdepth 2
          echo "=== Schemes ==="
          find $GITHUB_WORKSPACE/kaliOS/ios -name "*.xcworkspace" -maxdepth 2 | head -1 | xargs -I{} xcodebuild -list -workspace {} 2>&1 || true

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          BUILD_DIR=$RUNNER_TEMP/build
          LOG_FILE=$RUNNER_TEMP/xcodebuild.log
          mkdir -p $BUILD_DIR

          IOS_DIR=$GITHUB_WORKSPACE/kaliOS/ios

          # Détecte le workspace avec path absolu
          WORKSPACE=$(find $IOS_DIR -name "*.xcworkspace" -maxdepth 2 -not -path "*/xcuserdata/*" | head -1)
          echo "Workspace trouvé: $WORKSPACE"

          if [ -z "$WORKSPACE" ]; then
            echo "ERREUR: Aucun .xcworkspace trouvé dans $IOS_DIR"
            ls -la $IOS_DIR
            exit 1
          fi

          # Déduit le scheme du nom du workspace
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $BUILD_DIR \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee $LOG_FILE

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — Erreurs ==="
            grep "error:" $LOG_FILE | grep -v "^note" | tail -20
            exit 1
          fi

          echo "=== .app générés ==="
          find $BUILD_DIR -name "*.app" 2>/dev/null

      - name: Package .ipa
        run: |
          BUILD_DIR=$RUNNER_TEMP/build

          APP_PATH=$(find $BUILD_DIR -name "*.app" \
            -not -path "*simulator*" \
            -not -path "*SimulatorSDK*" \
            -not -name "*.appex" \
            2>/dev/null | head -1)

          echo "APP_PATH: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "Tous les fichiers dans build:"
            find $BUILD_DIR -maxdepth 5 2>/dev/null
            exit 1
          fi

          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "✅ IPA créé!"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30
