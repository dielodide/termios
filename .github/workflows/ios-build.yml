name: iOS IPA Build

on:
  push:
    branches: [Aok]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: cd kaliOS && npm ci

      # ---------------------------------------------------------------
      # Patch ExpoModulesCore Swift source BEFORE expo prebuild
      # Root cause: EMC 55.x declares swift_version="6.0" but ships
      # incomplete Swift-6 concurrency fixes (issue #42525 expo/expo).
      # Fix 1 – ViewDefinition.swift: move @MainActor out of conformance
      #          list (Swift-5 syntax) so SWIFT_VERSION=5 compiles it.
      # Fix 2 – PersistentFileLog.swift: mark handler as @Sendable.
      # ---------------------------------------------------------------
      - name: Patch ExpoModulesCore Swift source
        run: |
          EMC="$GITHUB_WORKSPACE/kaliOS/node_modules/expo-modules-core/ios"

          patch_file() {
            local f="$1"; local from="$2"; local to="$3"
            [ -f "$f" ] || return 0
            if grep -qF "$from" "$f"; then
              sed -i '' "s|${from}|${to}|g" "$f"
              echo "Patched: $f"
            else
              echo "Pattern not found (skip): $f"
            fi
          }

          # ViewDefinition.swift
          patch_file "$EMC/Core/ViewDefinition.swift" \
            "extension UIView: @MainActor AnyArgument" \
            "@MainActor extension UIView: AnyArgument"
          patch_file "$EMC/Core/Views/ViewDefinition.swift" \
            "extension UIView: @MainActor AnyArgument" \
            "@MainActor extension UIView: AnyArgument"

          # PersistentFileLog.swift
          patch_file "$EMC/Core/Logging/PersistentFileLog.swift" \
            "typealias PersistentFileLogCompletionHandler = (Error?) -> Void" \
            "typealias PersistentFileLogCompletionHandler = @Sendable (Error?) -> Void"

          # Broader fallback: any remaining `: @MainActor <Protocol>` in class/extension lines
          find "$EMC" -name "*.swift" | while IFS= read -r f; do
            grep -qF ': @MainActor ' "$f" 2>/dev/null || continue
            # Only rewrite lines that start with class/extension/struct/enum
            sed -i '' '/^\(class\|extension\|struct\|enum\) .* @MainActor /! {
              /: @MainActor [A-Z]/s/\(.*\): @MainActor \([A-Za-z]\)/@MainActor \1: \2/
            }' "$f" 2>/dev/null || true
            echo "Broad-patch: $f"
          done

          echo "=== Source patch done ==="

      - name: Expo prebuild iOS
        run: cd kaliOS && npx expo prebuild --platform ios --clean --no-install

      # ---------------------------------------------------------------
      # Podfile patch: force SWIFT_VERSION=5 for ExpoModulesCore only.
      # In Swift-5 mode (Swift 5.10 under Xcode 16.2) strict concurrency
      # is NOT enforced, which silences the remaining actor-isolation
      # errors that our source patches don't cover.
      # Multiple post_install blocks are fully supported by CocoaPods.
      # ---------------------------------------------------------------
      - name: Patch Podfile – SWIFT_VERSION=5 for ExpoModulesCore
        run: |
          PODFILE="$GITHUB_WORKSPACE/kaliOS/ios/Podfile"
          printf '\npost_install do |installer|\n' >> "$PODFILE"
          printf '  expo_swift5_targets = %%w[ExpoModulesCore ExpoModulesJSI]\n' >> "$PODFILE"
          printf '  installer.pods_project.targets.each do |target|\n' >> "$PODFILE"
          printf '    next unless expo_swift5_targets.include?(target.name)\n' >> "$PODFILE"
          printf '    target.build_configurations.each do |config|\n' >> "$PODFILE"
          printf '      config.build_settings["SWIFT_VERSION"] = "5"\n' >> "$PODFILE"
          printf '      base = config.build_settings["OTHER_SWIFT_FLAGS"] || "$(inherited)"\n' >> "$PODFILE"
          printf '      config.build_settings["OTHER_SWIFT_FLAGS"] = "#{base} -strict-concurrency=minimal"\n' >> "$PODFILE"
          printf '    end\n' >> "$PODFILE"
          printf '  end\n' >> "$PODFILE"
          printf 'end\n' >> "$PODFILE"
          echo "=== Podfile tail ==="
          tail -20 "$PODFILE"

      - name: Pod install
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kaliOS/ios"
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/pod-install.log"

      - name: Build .app unsigned
        run: |
          set -o pipefail
          IOS_DIR="$GITHUB_WORKSPACE/kaliOS/ios"
          BUILD_DIR="$RUNNER_TEMP/build"
          LOG_FILE="$RUNNER_TEMP/xcodebuild.log"
          mkdir -p "$BUILD_DIR"

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcworkspace" \
            -not -name "Pods.xcworkspace" \
            -not -path "*/xcuserdata/*" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERREUR: aucun .xcworkspace trouvé"
            ls -la "$IOS_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} /^[[:space:]]*$/{flag=0} flag{gsub(/^[[:space:]]+/,""); print; exit}')
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Workspace : $WORKSPACE"
          echo "Scheme    : $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "===== ERREURS ====="
            grep -E '^.+error: ' "$LOG_FILE" | head -80
            echo "===== RAW TAIL ====="
            tail -80 "$LOG_FILE"
            exit 1
          fi

          echo "===== Apps trouvées ====="
          find "$BUILD_DIR" -name "*.app" -not -name "*.appex"

      - name: Package .ipa
        run: |
          BUILD_DIR="$RUNNER_TEMP/build"
          APP_PATH=$(find "$BUILD_DIR/Build/Products" -maxdepth 3 \
            -path "*Release-iphoneos*" -name "*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          echo "APP: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            find "$BUILD_DIR" -maxdepth 6
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "IPA OK!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
