name: iOS IPA Build

on:
  push:
    branches:
      - Aok
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: |
          cd kaliOS
          npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Expo Prebuild iOS
        run: |
          cd kaliOS
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install --repo-update

      - name: Get scheme name
        id: scheme
        run: |
          SCHEME=$(cd kaliOS/ios && ls *.xcworkspace | sed 's/.xcworkspace//')
          echo "name=$SCHEME" >> $GITHUB_OUTPUT
          echo "Scheme détecté: $SCHEME"

      - name: Build Archive (unsigned)
        run: |
          cd kaliOS/ios
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            clean archive 2>&1 | xcpretty || true

      - name: Debug archive structure
        run: |
          echo "=== Contenu de RUNNER_TEMP ==="
          ls -la $RUNNER_TEMP/
          echo "=== Contenu xcarchive ==="
          find $RUNNER_TEMP/app.xcarchive -type f -name "*.app" 2>/dev/null || echo "Aucun .app trouvé"
          find $RUNNER_TEMP/app.xcarchive -maxdepth 4 2>/dev/null || echo "xcarchive vide ou absent"
          echo "=== Cherche .app ailleurs ==="
          find $RUNNER_TEMP -name "*.app" -maxdepth 6 2>/dev/null
          find ~/Library/Developer/Xcode -name "*.xcarchive" 2>/dev/null | head -5

      - name: Package .ipa
        run: |
          # Cherche le .app dans l'archive ou ailleurs
          APP_PATH=$(find $RUNNER_TEMP/app.xcarchive -name "*.app" -maxdepth 5 2>/dev/null | head -1)

          # Si pas trouvé dans RUNNER_TEMP, cherche dans Xcode DerivedData
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode -name "*.xcarchive" 2>/dev/null | head -1)
            APP_PATH=$(find "$APP_PATH" -name "*.app" 2>/dev/null | head -1)
          fi

          echo "APP_PATH trouvé: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERREUR: Aucun .app trouvé — le build a peut-être échoué silencieusement"
            exit 1
          fi

          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r AgonPreview-unsigned.ipa Payload
          echo "✅ IPA créé: $(ls -lh $RUNNER_TEMP/AgonPreview-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30
