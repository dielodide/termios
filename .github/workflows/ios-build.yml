name: iOS IPA Build

on:
  push:
    branches:
      - Aok
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaliOS/package-lock.json

      - name: Install dependencies
        run: |
          cd kaliOS
          npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Expo Prebuild iOS
        run: |
          cd kaliOS
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile — disable code signing on all pods
        run: |
          PODFILE=$GITHUB_WORKSPACE/kaliOS/ios/Podfile
          echo "" >> $PODFILE
          cat >> $PODFILE << 'EOF'

post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
      config.build_settings['CODE_SIGN_IDENTITY'] = ''
      config.build_settings['PROVISIONING_PROFILE'] = ''
      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
    end
  end
end
EOF
          echo "=== Podfile patché ==="
          tail -20 $PODFILE

      - name: Pod install
        run: |
          cd $GITHUB_WORKSPACE/kaliOS/ios
          pod install --repo-update

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          BUILD_DIR=$RUNNER_TEMP/build
          LOG_FILE=$RUNNER_TEMP/xcodebuild.log
          mkdir -p $BUILD_DIR
          IOS_DIR=$GITHUB_WORKSPACE/kaliOS/ios

          WORKSPACE=$(find $IOS_DIR -name "*.xcworkspace" -maxdepth 2 \
            -not -path "*/xcuserdata/*" \
            -not -path "*/Pods/*" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $BUILD_DIR \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee $LOG_FILE

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== ERREURS DE BUILD ==="
            grep -E "^.+error:.+" $LOG_FILE | grep -v "responseFileError" | tail -30
            exit 1
          fi

          echo "=== .app générés ==="
          find $BUILD_DIR -name "*.app" -not -name "*.appex" 2>/dev/null

      - name: Package .ipa
        run: |
          BUILD_DIR=$RUNNER_TEMP/build

          APP_PATH=$(find $BUILD_DIR -name "*.app" \
            -not -path "*simulator*" \
            -not -path "*SimulatorSDK*" \
            -not -name "*.appex" \
            2>/dev/null | head -1)

          echo "APP_PATH: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            find $BUILD_DIR -maxdepth 6 2>/dev/null
            exit 1
          fi

          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r AgonPreview-unsigned.ipa Payload
          ls -lh AgonPreview-unsigned.ipa
          echo "✅ IPA créé!"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgonPreview-unsigned-ipa
          path: ${{ runner.temp }}/AgonPreview-unsigned.ipa
          retention-days: 30
